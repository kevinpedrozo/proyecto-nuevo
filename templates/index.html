<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Estudiantes</title>
    <style>
        :root {
            --oficina-navy: #2c3e50;
            --oficina-azul: #34495e;
            --oficina-accent: #2980b9;
            --oficina-success: #27ae60;
            --oficina-gray: #bdc3c7;
        }
        body { 
            background: #f4f7f6; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; 
        }
        .contenedor { 
            background: #ffffff; width: 100%; max-width: 450px; padding: 40px; 
            border-radius: 4px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            border-top: 5px solid var(--oficina-navy);
        }
        h2 { color: var(--oficina-navy); text-align: center; margin-bottom: 25px; font-weight: 600; }
        input { 
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; 
            border-radius: 2px; box-sizing: border-box; 
        }
        
        .btn { 
            width: 100%; padding: 12px; border: none; border-radius: 2px; 
            font-weight: 600; cursor: pointer; text-decoration: none; display: block; 
            text-align: center; margin-bottom: 10px; text-transform: uppercase; font-size: 13px;
        }
        .btn-guardar { background: var(--oficina-navy); color: white; }
        .btn-guardar:hover { background: #34495e; }
        
        .btn-exito { background: var(--oficina-success); color: white; }
        .btn-ver { background: var(--oficina-accent); color: white; }
        .btn-alerta { background: #d35400; color: white; }
        
        .mensaje { 
            text-align: center; padding: 10px; margin-bottom: 15px; 
            font-size: 14px; font-weight: bold; color: var(--oficina-navy); 
            background: #f9f9f9; border-left: 4px solid var(--oficina-navy);
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <h2>Panel de Registro</h2>
        
        {% if mensaje %}
            <div class="mensaje">{{ mensaje }}</div>
        {% endif %}

        <form action="/" method="POST">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="email" name="correo" placeholder="Correo institucional" required>
            <input type="text" name="documento" placeholder="Número de identificación" required>
            <button type="submit" class="btn btn-guardar">Registrar Estudiante</button>
        </form>

        {% if registro_exitoso %}
            <a href="/juego" class="btn btn-exito">Acceder al sistema de evaluación</a>
        {% endif %}

        {% if mostrar_ver %}
            <a href="/estudiantes" target="_blank" class="btn btn-alerta">Ver registros existentes</a>
        {% endif %}

        <a href="/estudiantes" target="_blank" class="btn btn-ver">Consulta de base de datos</a>
    </div>
</body>
</html>
