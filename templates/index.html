<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiantes</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; }
        body { 
            background: url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 40px; min-height: 100vh;
        }
        .contenedor, .tabla-contenedor { background: rgba(255, 255, 255, 0.95); width: 100%; max-width: 800px; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; padding: 12px; text-align: left; border-bottom: 2px solid #ddd; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Registro de Estudiantes</h2>
        <input type="text" id="nombre" placeholder="Nombre">
        <input type="email" id="correo" placeholder="Correo">
        <input type="text" id="doc" placeholder="Documento">
        <button onclick="agregarEstudiante()">Guardar Registro</button>
    </div>

    <div class="tabla-contenedor">
        <h2>Personal Registrado</h2>
        <table id="tablaEstudiantes">
            <thead>
                <tr><th>Nombre</th><th>Correo</th><th>Documento</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        function agregarEstudiante() {
            const nombre = document.getElementById('nombre').value;
            const correo = document.getElementById('correo').value;
            const doc = document.getElementById('doc').value;

            if(!nombre || !correo || !doc) return alert("Completa los campos");

            const tbody = document.querySelector('#tablaEstudiantes tbody');
            const fila = `<tr><td>${nombre}</td><td>${correo}</td><td>${doc}</td></tr>`;
            tbody.innerHTML += fila;

            // Limpiar campos
            document.getElementById('nombre').value = '';
            document.getElementById('correo').value = '';
            document.getElementById('doc').value = '';
        }
    </script>
</body>
</html>
