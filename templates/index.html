<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --bg-glass: rgba(255, 255, 255, 0.95);
        }

        body {
            /* Imagen de fondo tipo oficina */
            background: url('https://images.unsplash.com/photo-1497366216548-37526070297c?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .contenedor, .tabla-contenedor {
            background: var(--bg-glass);
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        h2 { color: var(--primary); margin-bottom: 25px; text-align: center; }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
        }

        .btn-guardar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: var(--accent);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-guardar:hover { background: #2980b9; }

        .mensaje {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
        }

        /* Diseño tabla */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background: #f8f9fa; color: #7f8c8d; text-transform: uppercase; font-size: 12px; padding: 15px; text-align: left; border-bottom: 2px solid #dee2e6; }
        td { padding: 15px; border-bottom: 1px solid #eee; font-size: 14px; }
        tr:hover { background: #f1f7fe; }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Registro de Estudiantes</h2>
        
        {% if mensaje %}
            <div class="mensaje">{{ mensaje }}</div>
        {% endif %}

        <form method="POST">
            <input type="text" name="nombre" placeholder="Nombre Completo" required>
            <input type="email" name="correo" placeholder="Correo Electrónico" required>
            <input type="text" name="documento" placeholder="Número de Documento" required>
            <button type="submit" class="btn-guardar">Guardar Registro</button>
        </form>
    </div>

    <div class="tabla-contenedor">
        <h2>Personal Registrado</h2>
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Documento</th>
                </tr>
            </thead>
            <tbody>
                {% for estudiante in estudiantes %}
                <tr>
                    <td>{{ estudiante.nombre }}</td>
                    <td>{{ estudiante.correo }}</td>
                    <td>{{ estudiante.documento }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" style="text-align:center;">No hay registros disponibles.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
