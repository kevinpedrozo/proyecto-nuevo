<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiantes</title>
    <style>
        body {
            background: url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor {
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 { color: #2c3e50; margin-bottom: 25px; text-align: center; }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn-guardar {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #3498db;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-guardar:hover { background: #2980b9; }

        /* Estilo para los mensajes */
        .mensaje {
            text-align: center;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            font-weight: bold;
        }

        /* Estilo del botón de éxito condicional */
        #btn-exito {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #27ae60;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Registro de Estudiantes</h2>
        
        {% if mensaje %}
            <div class="mensaje">{{ mensaje }}</div>
        {% endif %}

        <form action="/" method="POST">
            <input type="text" name="nombre" placeholder="Nombre" required>
            <input type="email" name="correo" placeholder="Correo" required>
            <input type="text" name="documento" placeholder="Documento" required>
            <button type="submit" class="btn-guardar">Guardar Registro</button>
        </form>

        {% if registro_exitoso %}
            <a href="#" id="btn-exito">
                ¡Registro Exitoso!
            </a>
        {% endif %}
    </div>

</body>
</html>
