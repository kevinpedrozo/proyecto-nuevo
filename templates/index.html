<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Estudiantes</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .contenedor{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
            width:350px;
        }

        h2{
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin:8px 0;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:10px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .mensaje{
            text-align:center;
            margin-top:10px;
            font-weight:bold;
        }
    </style>
</head>
<body>

<div class="contenedor">

    <h2>Registro de Estudiantes</h2>

    <form method="POST">

        <input
            type="text"
            name="nombre"
            placeholder="Nombre Completo"
            required
        >

        <input
            type="email"
            name="correo"
            placeholder="Correo Electrónico"
            required
        >

        <input
            type="text"
            name="documento"
            placeholder="Número de Documento"
            required
        >

        <button type="submit">
            Guardar Registro
        </button>

    </form>

    {% if mensaje %}
        <div class="mensaje">
            {{ mensaje }}
        </div>
    {% endif %}

</div>

</body>
</html>
